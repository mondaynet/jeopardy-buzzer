<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Jeopardy Buzzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      font-size: 18px;
      padding: 10px;
      margin-bottom: 20px;
      width: 220px;
      text-align: center;
      border-radius: 8px;
      border: none;
    }

    textarea {
      font-size: 16px;
      padding: 10px;
      margin-bottom: 20px;
      width: 280px;
      height: 90px;
      text-align: left;
      border-radius: 8px;
      border: none;
      resize: vertical;
    }

    button {
      font-size: 32px;
      padding: 30px 60px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: black;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
    }

    #releasedWrap {
      display: none;
      margin-top: 16px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 320px;
      text-align: center;
    }

    #releasedTitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h1>🔔 Jeopardy Buzzer</h1>

  <input id="name" placeholder="Dein Name">

  <button id="buzzBtn" disabled>BUZZ!</button>

  <textarea id="note" placeholder="Antwort (nur Host bis Freigabe sichtbar)"></textarea>

  <div id="status">Warte auf Freigabe…</div>

  <div id="releasedWrap">
    <div id="releasedTitle">Freigegeben:</div>
    <div id="releasedText"></div>
  </div>

  <!-- Firebase SDKs (NICHT ändern!) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    // 🔥 Firebase Projekt-Konfiguration
    const firebaseConfig = {
      apiKey: "AIzaSyCiuYIzIkUbuKvJfexM3__5YU19WIDK8mE",
      authDomain: "madsnackquiz.firebaseapp.com",
      databaseURL: "https://madsnackquiz-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "madsnackquiz",
      storageBucket: "madsnackquiz.firebasestorage.app",
      messagingSenderId: "251069550894",
      appId: "1:251069550894:web:a35b686d3d3c85913beabf"
    };

    // Firebase initialisieren
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const buzzerRef = db.ref("buzzer");

    const buzzBtn = document.getElementById("buzzBtn");
    const statusDiv = document.getElementById("status");
    const nameInput = document.getElementById("name");
    const noteInput = document.getElementById("note");
    const releasedWrap = document.getElementById("releasedWrap");
    const releasedText = document.getElementById("releasedText");

    let noteTimer = null;

    function pushNote() {
      const name = nameInput.value.trim();
      if (!name) {
        return;
      }
      const text = noteInput.value.trim();
      if (!text) {
        buzzerRef.child("notes").child(name).remove();
        return;
      }
      buzzerRef.child("notes").child(name).set(text);
    }

    noteInput.addEventListener("input", () => {
      if (noteTimer) {
        clearTimeout(noteTimer);
      }
      noteTimer = setTimeout(pushNote, 300);
    });

    nameInput.addEventListener("change", pushNote);

    // 🔁 Realtime Listener (robust!)
    buzzerRef.on("value", snapshot => {
      const data = snapshot.val() || {};

      const active = data.active === true;
      const winner = data.winner || "";
      const notesVisible = data.notes_visible === true;
      const releasedName = data.notes_released_name || "";
      const notes = data.notes || {};

      if (active && winner === "") {
        buzzBtn.disabled = false;
        statusDiv.textContent = "BUZZER FREI!";
      } else {
        buzzBtn.disabled = true;

        if (winner !== "") {
          statusDiv.textContent = "❌ Zu spät!";
        } else {
          statusDiv.textContent = "Warte auf Freigabe…";
        }
      }

      if (notesVisible && releasedName) {
        const noteText = notes[releasedName] || "";
        releasedText.textContent = noteText ? `${releasedName}: ${noteText}` : `${releasedName}: -`;
        releasedWrap.style.display = "block";
      } else {
        releasedText.textContent = "";
        releasedWrap.style.display = "none";
      }
    });

    // 🔔 Buzz-Button
    buzzBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();

      if (!name) {
        alert("Bitte Namen eingeben!");
        return;
      }

      buzzerRef.transaction(current => {
        const base = current || {};
        if (
          base.active === true &&
          (base.winner === "" || base.winner === undefined)
        ) {
          return Object.assign({}, base, {
            active: false,
            winner: name,
            timestamp: Date.now()
          });
        }
        return; // verloren
      });
    });
  </script>

</body>
</html>
